name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run non-browser tests
        run: python -m pytest -m "not browser"

  browser:
    runs-on: ubuntu-latest
    env:
      GARMIN_TEST_ARTIFACTS: .tools/browser-artifacts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies and Chromium
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m playwright install --with-deps chromium
      - name: Run browser scenarios
        run: python -m pytest -m browser
      - name: Retain browser screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure-screenshots
          path: .tools/browser-artifacts
          if-no-files-found: ignore

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run Windows release and process regression tests
        run: >-
          python -m pytest tests/test_installer_packaging.py
          tests/test_garmin_credentials.py tests/test_frozen_sync_packaging.py
          tests/test_sync_process_tree.py
